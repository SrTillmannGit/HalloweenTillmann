<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Moderação dos Avistamentos</title>
<meta name="theme-color" content="#050404">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Lato:wght@400;700;900&family=Special+Elite&display=swap">
<style>
/* Página de trabalho: fundo escuro do site, cartões e botões grandes para aprovar fotos pelo celular durante a festa. */
:root{
  --muro:#050404;
  --cartao:#1a1716;
  --borda:#332d2a;
  --texto:#e9e3d6;
  --suave:#a39a8c;
  --sangue:#7d0a07;
  --sangue-vivo:#b3140d;
  --verde:#2f6b3a;
  --verde-vivo:#3c8a4a;
  --f-titulo:"Pirata One",Georgia,serif;
  --f-texto:"Lato",system-ui,sans-serif;
  --f-ficha:"Special Elite","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--muro)}
body{margin:0;min-height:100vh;color:var(--texto);font:16px/1.5 var(--f-texto);background:var(--muro);
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
img{display:block;max-width:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sangue-vivo);outline-offset:2px}
main{max-width:1100px;margin:0 auto}

h1{font:400 clamp(1.9rem,6vw,2.6rem)/1 var(--f-titulo);margin:0;letter-spacing:.02em}
.sub{color:var(--suave);margin:.35em 0 0;font-size:.95rem}

/* login */
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.login form{display:grid;gap:14px}
.login label{display:grid;gap:5px;font-weight:700;font-size:.85rem;color:var(--suave)}
.login input{width:100%;padding:.75em .8em;background:var(--cartao);border:1px solid var(--borda);border-radius:6px;font-size:1rem}
.btn{appearance:none;border:0;border-radius:6px;padding:.75em 1.1em;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;cursor:pointer;
  background:var(--texto);color:var(--muro);min-height:44px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--texto);border:1px solid var(--borda)}
.btn-aprovar{background:var(--verde);color:#fff}
.btn-aprovar:hover{background:var(--verde-vivo)}
.btn-recusar{background:var(--sangue);color:#fff}
.btn-recusar:hover{background:var(--sangue-vivo)}
.erro{color:#ff8a80;margin:0;font-size:.9rem;min-height:1.4em}

/* painel */
.topo{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.abas{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--borda)}
.aba{appearance:none;background:none;border:0;border-bottom:3px solid transparent;padding:.6em .9em;font-weight:900;font-size:.85rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--suave);cursor:pointer;margin-bottom:-1px}
.aba[aria-selected="true"]{color:var(--texto);border-bottom-color:var(--sangue-vivo)}
.aba b{display:inline-block;min-width:1.6em;padding:0 .4em;margin-left:.35em;border-radius:99px;background:var(--borda);color:var(--texto);font-size:.8rem;text-align:center}
.aba.tem b{background:var(--sangue-vivo)}
.linha-status{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin:0 0 14px}
.status{font:.85rem/1.3 var(--f-ficha);color:var(--suave);margin:0}
.aviso{background:#2a1210;border:1px solid var(--sangue);border-radius:6px;padding:12px 14px;margin:0 0 16px}
.grade{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.item{background:var(--cartao);border:1px solid var(--borda);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#000;cursor:zoom-in}
.info{padding:10px 12px 12px;display:grid;gap:4px;flex:1}
.num{font:.8rem var(--f-ficha);color:var(--suave);display:flex;justify-content:space-between;gap:8px}
.quem{font-weight:700}
.relato{color:var(--suave);font-size:.9rem;overflow-wrap:anywhere}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:8px}
.item.saindo{opacity:.35;pointer-events:none}
.vazio{color:var(--suave);text-align:center;padding:40px 0;grid-column:1/-1}

/* foto ampliada */
.ampliada{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.ampliada img{max-height:92vh;width:auto}
</style>
</head>
<body>
<main>
  <section class="login" id="telaLogin" aria-labelledby="tituloLogin">
    <div>
      <h1 id="tituloLogin">Moderação</h1>
      <p class="sub">Entre com o usuário moderador do Supabase.</p>
    </div>
    <form id="formLogin">
      <label>E-mail <input id="email" type="email" autocomplete="username" required></label>
      <label>Senha <input id="senha" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit" id="entrar">Entrar</button>
      <p class="erro" id="erroLogin" role="alert"></p>
    </form>
  </section>

  <section id="painel" hidden aria-labelledby="tituloPainel">
    <div class="topo">
      <div>
        <h1 id="tituloPainel">Moderação dos avistamentos</h1>
        <p class="sub" id="quem"></p>
      </div>
      <div class="acoes">
        <button class="btn btn-sec" type="button" id="atualizar">Atualizar</button>
        <button class="btn btn-sec" type="button" id="sair">Sair</button>
      </div>
    </div>
    <p class="aviso" id="semPermissao" hidden>Este usuário entrou, mas <strong>não está cadastrado como moderador</strong>. Cadastre o e-mail na tabela <code>moderadores</code> (veja <code>moderacao-setup.sql</code>).</p>
    <div class="abas" role="tablist">
      <button class="aba" role="tab" type="button" id="abaPendentes" aria-selected="true">Pendentes <b id="nPendentes">0</b></button>
      <button class="aba" role="tab" type="button" id="abaAprovados" aria-selected="false">No mural <b id="nAprovados">0</b></button>
    </div>
    <div class="linha-status">
      <p class="status" id="status" aria-live="polite"></p>
      <button class="btn btn-aprovar" type="button" id="aprovarTodas" hidden>Aprovar todas</button>
    </div>
    <ul class="grade" id="grade"></ul>
  </section>
</main>
<div class="ampliada" id="ampliada" hidden><img id="ampliadaImg" alt=""></div>

<script src="config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  const CFG = window.ESTE_HOMEM || {};
  const $ = id => document.getElementById(id);
  if (!CFG.supabaseUrl || !CFG.supabaseKey) {
    $("erroLogin").textContent = "O site ainda não está ligado ao Supabase (config.js vazio).";
    $("entrar").disabled = true;
    return;
  }
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
  let registros = [], aba = "pendentes", moderador = false;

  const hora = iso => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const nº = n => "Nº " + String(n).padStart(3, "0");
  // caminho do arquivo dentro do bucket, a partir da URL pública da foto
  const caminhoDaFoto = url => {
    const marca = `/object/public/${CFG.bucket}/`, i = (url || "").indexOf(marca);
    return i < 0 ? null : decodeURIComponent(url.slice(i + marca.length).split("?")[0]);
  };

  // ---------- login ----------
  $("formLogin").addEventListener("submit", async e => {
    e.preventDefault();
    $("erroLogin").textContent = ""; $("entrar").disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("senha").value });
    $("entrar").disabled = false;
    if (error) $("erroLogin").textContent = error.message === "Invalid login credentials" ? "E-mail ou senha incorretos." : error.message;
  });
  $("sair").addEventListener("click", () => sb.auth.signOut());

  let timer = null;
  sb.auth.onAuthStateChange(async (_evento, sessao) => {
    const logado = !!sessao;
    $("telaLogin").hidden = logado; $("painel").hidden = !logado;
    clearInterval(timer);
    if (!logado) { document.title = "Moderação dos Avistamentos"; return; }
    $("quem").textContent = "Conectado como " + sessao.user.email;
    const { data } = await sb.rpc("eh_moderador");
    moderador = data === true;
    $("semPermissao").hidden = moderador;
    carregar();
    timer = setInterval(() => { if (!document.hidden) carregar(); }, 15000);
  });

  // ---------- lista ----------
  async function carregar() {
    const { data, error } = await sb.from(CFG.tabela).select("*").order("created_at", { ascending: false }).limit(1000);
    if (error) { $("status").textContent = "Erro ao carregar: " + error.message; return; }
    registros = data;
    render();
    $("status").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR");
  }
  $("atualizar").addEventListener("click", carregar);

  function trocarAba(nova) {
    aba = nova;
    $("abaPendentes").setAttribute("aria-selected", aba === "pendentes");
    $("abaAprovados").setAttribute("aria-selected", aba === "aprovados");
    render();
  }
  $("abaPendentes").addEventListener("click", () => trocarAba("pendentes"));
  $("abaAprovados").addEventListener("click", () => trocarAba("aprovados"));

  function render() {
    const total = registros.length;
    // numeração pela ordem de chegada, igual para pendentes e aprovados
    const numero = new Map(registros.map((r, i) => [r.id, total - i]));
    const pendentes = registros.filter(r => !r.aprovado), aprovados = registros.filter(r => r.aprovado);
    $("nPendentes").textContent = pendentes.length; $("abaPendentes").classList.toggle("tem", pendentes.length > 0);
    $("nAprovados").textContent = aprovados.length;
    document.title = (pendentes.length ? `(${pendentes.length}) ` : "") + "Moderação dos Avistamentos";
    $("aprovarTodas").hidden = !(aba === "pendentes" && pendentes.length > 1 && moderador);

    const lista = aba === "pendentes" ? pendentes : aprovados, grade = $("grade");
    grade.replaceChildren();
    if (!lista.length) {
      grade.append(el("li", "vazio", aba === "pendentes" ? "Nenhuma foto esperando aprovação." : "Nenhuma foto aprovada no mural ainda."));
      return;
    }
    lista.forEach(r => {
      const n = numero.get(r.id), li = el("li", "item");
      const img = el("img"); img.src = r.foto_url; img.alt = "Foto do avistamento " + n; img.loading = "lazy";
      img.addEventListener("click", () => { $("ampliadaImg").src = r.foto_url; $("ampliada").hidden = false; });
      const info = el("div", "info");
      const cab = el("div", "num"); cab.append(el("span", null, nº(n)), el("time", null, hora(r.created_at)));
      info.append(cab);
      const quem = [r.apelido, r.local && "em " + r.local].filter(Boolean).join(" · ");
      if (quem) info.append(el("div", "quem", quem));
      if (r.relato) info.append(el("div", "relato", "“" + r.relato + "”"));
      const botoes = el("div", "botoes");
      const sim = el("button", "btn " + (r.aprovado ? "btn-sec" : "btn-aprovar"), r.aprovado ? "Tirar do mural" : "Aprovar");
      const nao = el("button", "btn btn-recusar", r.aprovado ? "Excluir" : "Recusar");
      [sim, nao].forEach(b => { b.type = "button"; b.disabled = !moderador; });
      sim.addEventListener("click", () => aprovar(r, li, !r.aprovado));
      nao.addEventListener("click", () => excluir(r, li, n));
      botoes.append(sim, nao);
      info.append(botoes);
      li.append(img, info);
      grade.append(li);
    });
  }
  $("ampliada").addEventListener("click", () => { $("ampliada").hidden = true; });

  // ---------- aprovar / tirar do mural ----------
  async function aprovar(r, li, valor) {
    li.classList.add("saindo");
    const { data, error } = await sb.from(CFG.tabela).update({ aprovado: valor }).eq("id", r.id).select("id");
    if (error || !data?.length) {
      li.classList.remove("saindo");
      alert("Não foi possível alterar: " + (error?.message || "sem permissão de moderador."));
      return;
    }
    r.aprovado = valor;
    render();
  }
  $("aprovarTodas").addEventListener("click", async () => {
    const ids = registros.filter(r => !r.aprovado).map(r => r.id);
    if (!confirm(`Aprovar as ${ids.length} fotos pendentes? Elas vão aparecer no mural.`)) return;
    $("aprovarTodas").disabled = true;
    const { error } = await sb.from(CFG.tabela).update({ aprovado: true }).in("id", ids);
    $("aprovarTodas").disabled = false;
    if (error) { alert("Não foi possível aprovar: " + error.message); return; }
    carregar();
  });

  // ---------- recusar / excluir ----------
  async function excluir(r, li, n) {
    if (!confirm(`Excluir o avistamento ${nº(n)}?\n\nA foto e o relato serão apagados de vez.`)) return;
    li.classList.add("saindo");
    // primeiro o registro; o banco devolve as linhas apagadas (vazio = sem permissão)
    const { data, error } = await sb.from(CFG.tabela).delete().eq("id", r.id).select("id");
    if (error || !data?.length) {
      li.classList.remove("saindo");
      alert("Não foi possível excluir: " + (error?.message || "sem permissão de moderador."));
      return;
    }
    const caminho = caminhoDaFoto(r.foto_url);
    if (caminho) {
      const { error: errFoto } = await sb.storage.from(CFG.bucket).remove([caminho]);
      if (errFoto) console.warn("Registro excluído, mas o arquivo da foto ficou no Storage:", errFoto.message);
    }
    registros = registros.filter(x => x.id !== r.id);
    render();
    $("status").textContent = `${nº(n)} excluído`;
  }
})();
</script>
</body>
</html>
